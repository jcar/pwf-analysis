[project]
name = "pwf-analysis"
version = "0.1.0"
description = "Deterministic analysis of Private Water Fishing club reports"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28", "selectolax>=0.3", "pandas>=2.2",
  "numpy>=1.26", "pyyaml>=6.0", "typer>=0.12", "rich>=13.0",
]

[project.scripts]
pwf = "pwf.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
